name: Publish SmartMushroom test APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-smartmushroom.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build archive
        env:
          ARCHIVE_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-8df8-8207-9a88-840d77b965f6/raw?se=2026-11-26T20%3A51%3A38Z&sp=r&sv=2026-06-06&sr=b&scid=cfbda5af-5837-5a50-962c-ac81e94ab927&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-26T19%3A39%3A24Z&ske=2026-11-27T19%3A39%3A24Z&sks=b&skv=2026-06-06&sig=HK6qOAdSiIDvUnU%2BzGjm%2BMkFMY07wc9WeHZLe1ukZDU%3D'
        run: |
          curl --fail --silent --show-error --location --retry 2 "$ARCHIVE_URL" -o build.zip
          echo "3ab0d4dbcb493edb27677912a9b869a6a1dfc35db1287dd79954aa4b2f1e699f  build.zip" | sha256sum -c -
          unzip -j build.zip SmartMushroom.apk
          echo "e8036b200dab7866f68931607ec1256400b116c8571c6b270b7ac9ed4e380a3c  SmartMushroom.apk" | sha256sum -c -
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create smartmushroom-test-3-1 SmartMushroom.apk --repo "$GITHUB_REPOSITORY" --target main --title "SmartMushroom 1.0 (Test)" --notes "Verified original GitHub Actions build 45892366418. Android 7.0+; debug-signed test APK. Device compatibility has not been fully tested." --prerelease --latest=false
